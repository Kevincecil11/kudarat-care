name: Private preview

on:
  push:
    branches: [fullstack]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-preview
  cancel-in-progress: true

env:
  PREVIEW_DIR: studio-erepzt658c

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full-stack branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove server-only API routes from the static preview
        run: rm -rf src/app/api

      - name: Build static preview
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_PREVIEW: "1"
          NEXT_PUBLIC_BASE_PATH: /kudarat-care/${{ env.PREVIEW_DIR }}
          NEXT_PUBLIC_SITE_URL: https://kevincecil11.github.io/kudarat-care/${{ env.PREVIEW_DIR }}
          # Public keys only (safe in the browser, protected by Row Level Security).
          NEXT_PUBLIC_SUPABASE_URL: https://hvxztbrquhebaypfibgr.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2eHp0YnJxdWhlYmF5cGZpYmdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDQxNTYsImV4cCI6MjEwODU4MDE1Nn0.l8jpVuQ9kyJaWRBOHBtmIchYgOXrVhoj-kS21_Jz04A

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Publish into the hidden folder on main
        run: |
          rm -rf "site-main/$PREVIEW_DIR"
          cp -r out "site-main/$PREVIEW_DIR"
          touch site-main/.nojekyll
          cd site-main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No preview changes"; exit 0; fi
          git commit -m "Update private preview from ${GITHUB_SHA::7}"
          git push
